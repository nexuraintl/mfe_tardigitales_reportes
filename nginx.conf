server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json font/woff font/woff2 application/font-woff;

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"UP"}';
    }

    location = /admin/tardigitales/reportes {
        return 301 /admin/tardigitales/reportes/;
    }

    location /admin/tardigitales/reportes/ {
        rewrite ^/admin/tardigitales/reportes/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files /$1 /index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Access-Control-Allow-Origin "*";
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
}