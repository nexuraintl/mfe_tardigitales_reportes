<!-- 1. Header Web Component -->
<nx-admin-header
  [appTitle]="'Reportes y Analítica'"
  [currentUser]="currentUser"
  [appGrid]="appGrid"
  (nx-navigate)="onNavigate($any($event))"
  (nx-app-change)="onAppChange($any($event))"
  (nx-profile-action)="onProfileAction($any($event))">
</nx-admin-header>

<div class="main-container" style="display: flex; min-height: calc(100vh - 64px); background-color: #f8f9fa;">
  <!-- 2. Sidebar de navegación -->
  <nx-admin-mod-sidebar
    [menuSections]="menuSections"
    [activePath]="currentUrl"
    [primaryAction]="primaryAction"
    (nx-navigate)="onNavigate($any($event))"
    (nx-primary-action)="onPrimaryAction($any($event))">
  </nx-admin-mod-sidebar>

  <!-- 3. Área principal de contenido -->
  <main class="content-area" style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
    <!-- Barra de opciones / Título de vista y botones dinámicos -->
    <nx-admin-mod-options
      [pageTitle]="pageTitle"
      [showBackButton]="true"
      (nx-back)="onBack()">
      <div slot="actions" class="d-flex gap-2 align-items-center" *ngIf="viewActions && viewActions.length > 0">
        <button 
          *ngFor="let act of viewActions"
          type="button" 
          [ngClass]="act.btnClass || 'btn btn-primary'" 
          (click)="ejecutarAccion(act)">
          <span *ngIf="act.icon" [class]="act.icon + ' me-1'"></span>
          {{ act.label }}
        </button>
      </div>
    </nx-admin-mod-options>

    <!-- 4. Contenedor de contenido donde se proyecta el router de Angular -->
    <nx-admin-mod-content slot="content" style="flex: 1;">
      <div class="container-fluid p-4">
        <router-outlet (activate)="onRouteActivate($event)"></router-outlet>
      </div>
    </nx-admin-mod-content>
  </main>
</div>

<!-- 5. Footer Web Component -->
<nx-admin-footer [version]="'Versión 1.0.0'"></nx-admin-footer>
