<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Reportes y Analítica - Tarjetas Digitales</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- 1. CARGA DINÁMICA DE WEB COMPONENTS SEGÚN ENTORNO (Local / Preprod / Prod) -->
  <script>
    (function() {
      const host = window.location.hostname;
      let cdnBase = 'https://cdn.nexura.com.co'; // Producción por defecto

      if (host === 'localhost' || host === '127.0.0.1' || host.startsWith('local-')) {
        // Entorno Local (Docker / Gateway)
        cdnBase = 'http://local-cdn.nexura.com.co';
      } else if (host.includes('preproduccion') || host.includes('qa') || host.includes('dev')) {
        // Entorno Preproducción / QA / Dev
        cdnBase = 'https://preproduccion-cdn.nexura.com.co';
      }

      // Inyectar CSS del Layout
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = `${cdnBase}/web-components/admin/v1/layout.css`;
      document.head.appendChild(link);

      // Inyectar JS del Layout (Web Components Lit)
      const script = document.createElement('script');
      script.type = 'module';
      script.src = `${cdnBase}/web-components/admin/v1/layout.js`;
      document.head.appendChild(script);
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
